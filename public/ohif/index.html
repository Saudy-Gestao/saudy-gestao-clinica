<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="description" content="Open Health Imaging Foundation DICOM Viewer" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0,minimum-scale=1,maximum-scale=1,user-scalable=no" />
  <meta name="theme-color" content="#000000" />
  <meta http-equiv="cleartype" content="on" />
  <meta name="MobileOptimized" content="320" />
  <meta name="HandheldFriendly" content="True" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>OHIF Viewer</title>
  <link rel="stylesheet" href="/ohif/brand.css" />
</head>

<body>
  <noscript> You need to enable JavaScript to run this app. </noscript>

  <div id="root"></div>

  <script type="text/javascript">
    const params = new URLSearchParams(window.location.search);
    const studyUID = params.get('studyUID');

    window.__ohif__ = { studyUID };
  </script>

  <script type="text/javascript" src="/ohif/app-config.js"></script>
  <script type="text/javascript">
    const runtime = window.__ohif__ || {};
    const isLocalDev = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1';

    if (isLocalDev) {
      const ORTHANC_HTTP = 'http://localhost:8042';
      const ORTHANC_HTTPS = 'https://localhost:8042';
      const LOCAL_PROXY = '/dicom-web';

      const rewriteDicomWebUrl = (value) => {
        if (typeof value !== 'string') return value;
        return value
          .replace(ORTHANC_HTTP, LOCAL_PROXY)
          .replace(ORTHANC_HTTPS, LOCAL_PROXY);
      };

      const originalFetch = window.fetch?.bind(window);
      if (originalFetch) {
        window.fetch = (input, init) => {
          if (typeof input === 'string') {
            return originalFetch(rewriteDicomWebUrl(input), init);
          }

          if (input instanceof Request) {
            const rewritten = rewriteDicomWebUrl(input.url);
            if (rewritten !== input.url) {
              const req = new Request(rewritten, input);
              return originalFetch(req, init);
            }
          }

          return originalFetch(input, init);
        };
      }

      const originalOpen = XMLHttpRequest.prototype.open;
      XMLHttpRequest.prototype.open = function(method, url, async, user, password) {
        const rewritten = rewriteDicomWebUrl(url);
        return originalOpen.call(this, method, rewritten, async, user, password);
      };
    }

    if (isLocalDev) {
      window.config = window.config || {};
      window.config.servers = window.config.servers || {};
      window.config.servers.dicomWeb = [
        {
          name: 'Orthanc',
          wadoUriRoot: '/dicom-web',
          qidoRoot: '/dicom-web',
          wadoRoot: '/dicom-web',
          qidoSupportsIncludeField: true,
          imageRendering: 'wadors',
          thumbnailRendering: 'wadors',
          enableStudyLazyLoad: true,
          supportsFuzzyMatching: true,
        },
      ];
    }

    if (runtime.studyUID && !window.location.pathname.includes('/viewer/')) {
      const targetPath = '/ohif/index.html/viewer/' + encodeURIComponent(runtime.studyUID);
      window.history.replaceState({}, '', targetPath + window.location.search);
    }
  </script>

  <!-- windowWidth/windowCenter vêm como string do metadata DICOM.
       O ViewportOverlay chama .toFixed() neles e quebra se for string.
       Patch em String.prototype antes do bundle carregar resolve o crash. -->
  <script>
    if (typeof String.prototype.toFixed === 'undefined') {
      String.prototype.toFixed = function(digits) {
        const n = Number(this);
        if (!Number.isFinite(n)) {
          return '0';
        }
        return n.toFixed(digits);
      };
    }
  </script>

  <script src="/ohif/index.umd.js" crossorigin></script>
  <script>
    var containerId = 'root';
    var componentRenderedOrUpdatedCallback = function () {
      console.log('OHIF Viewer rendered/updated');
    };

    if (!window.OHIFViewer || !window.OHIFViewer.installViewer) {
      throw new Error('OHIF bundle failed to load. Check /ohif/index.umd.js');
    }

    window.OHIFViewer.installViewer(window.config, containerId, componentRenderedOrUpdatedCallback);
  </script>
</body>

</html>
